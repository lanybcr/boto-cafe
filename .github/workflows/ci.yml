# Integração contínua: a cada push, regenera os dados do zero e roda os testes.
# Se alguém mudar uma regra e quebrar a integridade, os totais ou a equivalência SQL x pandas, o selo fica vermelho.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Gerar o banco do zero (valida a integridade)
        run: python -m src.gerar_dados

      - name: Gerar CSVs do Power BI e o dashboard HTML
        run: |
          python -m src.powerbi
          python -m src.html_dashboard

      - name: Rodar os testes
        run: pytest -q --tb=short 2>&1 | tee pytest.log

      # Se algum teste falhar, mostra o resumo como anotação na página da execução (sem precisar abrir o log).
      - name: Resumo das falhas
        if: failure()
        run: grep -E "^(FAILED|ERROR)|^E  " pytest.log | head -20 | while read -r linha; do echo "::error::${linha}"; done
